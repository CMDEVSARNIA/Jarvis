<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040805">
  <title>H.U.X.L.E.Y. · offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #040805; color: #4dff88; font-family: ui-monospace, Consolas, monospace;
      text-transform: uppercase; letter-spacing: 0.08em; text-shadow: 0 0 6px rgba(77, 255, 136, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    }
    main { max-width: 420px; border: 2px solid #1d5c33; background: #07110a; padding: 22px 20px; }
    img { width: 64px; height: 64px; display: block; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0 0 12px; letter-spacing: 0.2em; }
    p { font-size: 13px; line-height: 1.6; color: #39c56c; margin: 0 0 10px; }
    p::before { content: "▸ "; color: #1f7a44; }
    button {
      margin-top: 10px; width: 100%; height: 52px; border: 2px solid #4dff88; background: #4dff88; color: #040805;
      font: inherit; font-weight: 700; letter-spacing: 0.22em; text-shadow: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/huxley-192.png" alt="">
    <h1>&gt; NO LINK TO HUXLEY</h1>
    <p>Is the laptop on and awake, with Huxley running (green H near the clock)?</p>
    <p>Is Tailscale switched on, on this phone and on the laptop?</p>
    <p>If the laptop is on but this screen won’t connect, Telegram still reaches Huxley.</p>
    <button type="button" onclick="location.reload()">[ RETRY ]</button>
  </main>
</body>
</html>
